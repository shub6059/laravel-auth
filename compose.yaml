services:
  app:
    build: .
    restart: unless-stopped
    working_dir: /var/www/html
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f .env ]; then cp .env.example .env; fi
        composer install --no-interaction
        sed -i 's/^DB_HOST=.*/DB_HOST=mysql/' .env
        if grep -Eq '^DB_PASSWORD=$' .env; then
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=local-dev-password/' .env
        fi
        if grep -q '^ENABLE_RECAPTCHA=' .env; then
          sed -i 's/^ENABLE_RECAPTCHA=.*/ENABLE_RECAPTCHA=false/' .env
        else
          printf '\nENABLE_RECAPTCHA=false\n' >> .env
        fi
        if ! grep -Eq '^APP_KEY=.+$' .env; then
          php artisan key:generate
        fi
        exec php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel_auth}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      ENABLE_RECAPTCHA: "false"
    volumes:
      - .:/var/www/html:z
      - composer_vendor:/var/www/html/vendor:Z
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_auth}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: docker.io/phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  composer_vendor:
  mysql_data: